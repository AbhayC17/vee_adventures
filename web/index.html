<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Movement Missions: a gentle discovery game for little explorers, with Vee the tiger.">
  <meta name="theme-color" content="#FDF6E6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Movement Missions">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">
  <title>Movement Missions</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #FDF6E6;
      overflow: hidden;
    }

    /* Fallback for Flutter's HTML text surfaces. */
    body {
      font-family: "Arial Rounded MT Bold", "Comic Sans MS", "Trebuchet MS", Arial, sans-serif;
    }

    /* Shown while the game downloads, so children see something friendly
       instead of a blank screen. Removed on the first Flutter frame. */
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #FDF6E6;
      color: #08403A;
      font-size: 22px;
      font-weight: 700;
      z-index: 10;
      transition: opacity 0.35s ease;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    #loading img { width: 120px; height: 120px; border-radius: 28px; }
    #loading .dots { display: flex; gap: 10px; }
    #loading .dots span {
      width: 14px; height: 14px; border-radius: 50%;
      background: #0F5F55;
      animation: bounce 1s infinite ease-in-out;
    }
    #loading .dots span:nth-child(2) { animation-delay: 0.15s; }
    #loading .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.6; }
      40% { transform: translateY(-10px); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #loading .dots span { animation: none; }
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div>Getting ready for your adventure…</div>
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.classList.add('hide');
      setTimeout(function () { el.remove(); }, 450);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
